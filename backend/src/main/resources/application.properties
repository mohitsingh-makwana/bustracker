spring.application.name=bustracker

server.servlet.context-path=/api/v1

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/{MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

allowed_origins=${ALLOWED_ORIGINS}




spring.config.import=optional:file:./.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
user.verification.secret=${USER_VERIFICATION_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}


osrm.base-url=${OSRM_BASE_URL}
osrm.profile=${OSRM_PROFILE:driving}

osrm.connect-timeout=${OSRM_CONNECT_TIMEOUT:2s}
osrm.read-timeout=${OSRM_READ_TIMEOUT:5s}

osrm.max-retries=${OSRM_MAX_RETRIES:2}
osrm.retry-delay=${OSRM_RETRY_DELAY:500ms}

osrm.cache-ttl=${OSRM_CACHE_TTL:24h}
