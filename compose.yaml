
services:
  # 1. MySQL database
  mysql:
    image: mysql:8.0
    container_name: bustrackr-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      command: --default-time-zone=+05:30
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Redis for the latest live bus locations
  redis:
    image: redis:7-alpine
    container_name: bustrackr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. Spring Boot backend
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: bustrackr-backend
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata&forceConnectionTimeZoneToSession=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      OSRM_BASE_URL: ${OSRM_BASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React frontend served by Nginx
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_WS_URL: ws://localhost:8080/api/v1/ws
    container_name: bustrackr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

# Persistent storage
volumes:
  mysql_data:
  redis_data:
